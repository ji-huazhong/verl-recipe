hydra:
  searchpath:
    - pkg://verl.trainer.config
  run:
    dir: ${trainer.default_local_dir}/hydra

defaults:
  - ppo_trainer
  - base
  - _self_

data:
  train_files: ${oc.env:FLASH_DATA_DIR}/math/train.parquet
  val_files: ${oc.env:FLASH_DATA_DIR}/math/val.parquet
  train_max_samples: 7500
  max_response_length: 4096

actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-Math-1.5B
    override_config:
      max_position_embeddings: 6144
  actor:
    ppo_micro_batch_size_per_gpu: 2
  rollout:
    max_model_len: 6144

trainer:
  experiment_name: qwen_math
